<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Safety Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <header class="dashboard-header">
        <div class="header-inner">
            <h1>Road Safety Offences Dashboard</h1>
            <div class="dataset-toggle" style="margin-top: 10px;">
                <span style="color: white; font-size: 14px;">
                    <input type="radio" name="dataset" value="mp" id="radio-mp" checked> Mobile Phone
                </span>
                <span style="color: white; font-size: 14px; margin-left: 15px;">
                    <input type="radio" name="dataset" value="s" id="radio-s"> Seatbelt
                </span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="filters-section">
            <div class="filter-group"><label>Jurisdiction</label><select id="filter-jurisdiction"></select></div>
            <div class="filter-group"><label>Location</label><select id="filter-location"></select></div>
            <div class="filter-group"><label>Years</label><select id="filter-year"></select></div>
            <div class="filter-group"><label>Age Group</label><select id="filter-age"></select></div>
            <div class="filter-group"><label>Method</label><select id="filter-method"></select></div>
            <button id="reset-view-btn" class="reset-btn">Reset View</button>
        </section>

        <div class="dashboard-grid">
            <div class="chart-card">
                <div class="chart-header" style="justify-content: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                    <h3 style="text-align: center;">Summary for data from available filters</h3>
                </div>
                <div class="canvas-container" id="offenseLevelKpiContainer"></div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3>Annual Offenses by Location (%)</h3>
                    <div>
                        <button class="enlarge-btn" onclick="window.openDataTableModal('location')">&#x25A6;</button> 
                        <button class="enlarge-btn" onclick="window.openModal('location')">&#x2922;</button>
                    </div>
                </div>
                <div class="canvas-container"><canvas id="chart-location"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3>Annual Offenses by Detection Method</h3>
                    <div>
                        <button class="enlarge-btn" onclick="window.openDataTableModal('method')">&#x25A6;</button> 
                        <button class="enlarge-btn" onclick="window.openModal('method')">&#x2922;</button>
                    </div>
                </div>
                <div class="canvas-container"><canvas id="chart-method"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3>Annual Offenses by Jurisdiction</h3>
                    <div>
                        <button class="enlarge-btn" onclick="window.openDataTableModal('jurisdiction')">&#x25A6;</button> 
                        <button class="enlarge-btn" onclick="window.openModal('jurisdiction')">&#x2922;</button>
                    </div>
                </div>
                <div class="canvas-container"><canvas id="chart-jurisdiction"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3>Annual Offenses by Age Group</h3>
                    <div>
                        <button class="enlarge-btn" onclick="window.openDataTableModal('age')">&#x25A6;</button> 
                        <button class="enlarge-btn" onclick="window.openModal('age')">&#x2922;</button>
                    </div>
                </div>
                <div class="canvas-container"><canvas id="chart-age"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3>Jurisdiction (Normalized by License Holders)</h3>
                    <div>
                        <button class="enlarge-btn" onclick="window.openDataTableModal('normalized')">&#x25A6;</button> 
                        <button class="enlarge-btn" onclick="window.openModal('normalized')">&#x2922;</button>
                    </div>
                </div>
                <div class="canvas-container"><canvas id="chart-normalized"></canvas></div>
            </div>
        </div>
    </main>

    <div id="chart-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="document.getElementById('chart-modal').style.display='none'">&times;</span>
            <h2 id="modal-title">Chart View</h2>
            <div class="canvas-container" id="modal-chart-container">
                <canvas id="modal-canvas"></canvas>
            </div>
        </div>
    </div>

    <script src="js/dashboardUI.js" defer></script>
    <script src="js/kpiSummary.js" defer></script>
    <script src="js/detectionChart.js" defer></script>
    <script src="js/locationChart.js" defer></script>
    <script src="js/jurisdictionChart.js" defer></script>
    <script src="js/ageGroupChart.js" defer></script>
    <script src="js/normalizedCharts.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
